[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-decode"
version = "1.0.0"
description = "Real-time EEG streaming, preprocessing, and entropy decoding demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "scipy>=1.14",
  "brainflow>=5.13",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "websocket-client>=1.8"]

[tool.setuptools.packages.find]
include = ["eeg_decode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
